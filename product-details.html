<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details | Amano.ng</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bg-primary { background-color: #001F3F; }
        .bg-secondary { background-color: #FF8C00; }
        .text-primary { color: #001F3F; }
        .text-secondary { color: #FF8C00; }

        /* Glassmorphism for Price Box */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Fixed Mobile Action Bar Shadow */
        .mobile-action-bar {
            box-shadow: 0 -10px 20px rgba(0,0,0,0.05);
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-50 pb-24 md:pb-0">

    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 md:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <button onclick="history.back()" class="md:hidden text-primary">
                    <i class="fas fa-arrow-left text-xl"></i>
                </button>
                <img src="images/PNG3.png" alt="Amano" class="h-8 md:h-10 cursor-pointer" onclick="location.href='index.html'">
            </div>
            <div class="hidden md:flex items-center space-x-8 text-[13px] font-bold uppercase tracking-wider">
                <a href="index.html" class="text-primary hover:text-secondary">Marketplace</a>
                <a href="auth.html" class="bg-primary text-white px-8 py-3 rounded-2xl">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 md:py-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12">
            
            <div class="space-y-4">
                <div class="aspect-square bg-white rounded-[2rem] overflow-hidden border border-gray-100 shadow-sm relative">
                    <img id="main-product-image" src="" alt="Loading..." class="w-full h-full object-cover">
                    <div id="state-badge" class="absolute top-6 left-6 bg-white/95 px-4 py-2 rounded-2xl text-xs font-black uppercase text-primary shadow-lg flex items-center">
                        <i class="fas fa-map-marker-alt text-secondary mr-2"></i> <span id="display-state">Loading...</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col">
                <div class="mb-6">
                    <span id="product-category" class="text-secondary text-[10px] font-black uppercase tracking-[0.2em] mb-2 block">Category</span>
                    <h1 id="product-name" class="text-3xl md:text-5xl font-black text-primary uppercase tracking-tighter leading-tight mb-4">...</h1>
                    
                    <div class="flex items-center space-x-2 text-green-600 font-bold text-sm mb-6">
                        <i class="fas fa-check-circle"></i>
                        <span>Verified Producer</span>
                        <span class="mx-2 text-gray-300">|</span>
                        <span class="text-gray-500 font-medium">98% Response Rate</span>
                    </div>

                    <div class="glass-panel p-6 rounded-3xl border border-orange-100">
                        <div class="flex items-baseline space-x-2 mb-2">
                            <span class="text-4xl font-black text-primary tracking-tighter">₦<span id="product-price">0</span></span>
                            <span class="text-gray-400 font-bold uppercase text-xs">/ <span id="product-unit">unit</span></span>
                        </div>
                        <p class="text-xs text-gray-500 font-medium">Wholesale price for bulk orders</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white p-4 rounded-2xl border border-gray-100">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Min. Order</p>
                        <p class="text-sm font-black text-primary"><span id="product-moq">0</span> <span class="unit-label">...</span></p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-gray-100">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Availability</p>
                        <p class="text-sm font-black text-green-600">In Stock</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-gray-100">
                        <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Trade Volume</p>
                        <p class="text-sm font-black text-primary"><span id="product-sales">0</span> Sold</p>
                    </div>
                </div>

                <div class="mb-10">
                    <h4 class="font-black text-primary uppercase text-sm mb-3 tracking-widest">Description</h4>
                    <p id="product-description" class="text-gray-600 text-sm leading-relaxed">
                        Loading product details...
                    </p>
                </div>

                <div class="hidden md:flex space-x-4">
                    <button id="negotiate-btn" class="flex-1 bg-white border-2 border-primary text-primary py-4 rounded-2xl font-black uppercase text-sm hover:bg-gray-50 transition-all">
                        <i class="fas fa-comments mr-2"></i> Negotiate
                    </button>
                    <button id="buy-now-btn" class="flex-[1.5] bg-secondary text-white py-4 rounded-2xl font-black uppercase text-sm shadow-xl shadow-orange-500/20 hover:scale-[1.02] transition-all">
                        Start Order (Escrow)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white p-4 flex space-x-3 z-50 mobile-action-bar border-t">
        <button id="mobile-negotiate" class="flex-1 bg-white border-2 border-primary text-primary py-4 rounded-xl font-black uppercase text-[10px] tracking-widest">
            <i class="fas fa-comments mr-1"></i> Chat
        </button>
        <button id="mobile-buy" class="flex-[2] bg-secondary text-white py-4 rounded-xl font-black uppercase text-[10px] tracking-widest">
            Buy Now
        </button>
    </div>

    <script type="module" src="js/product-details.js"></script>
</body>
</html>
