<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Amano.ng | B2B Agriculture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-primary { background-color: #001F3F; }
        .bg-secondary { background-color: #FF8C00; }
        .text-primary { color: #001F3F; }
        .text-secondary { color: #FF8C00; }
        .border-primary { border-color: #001F3F; }
        
        /* Password Strength Colors */
        .strength-weak { width: 33.33%; background-color: #ef4444; }
        .strength-medium { width: 66.66%; background-color: #f59e0b; }
        .strength-strong { width: 100%; background-color: #22c55e; }

        /* Animation for DOM alerts */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex min-h-screen">
        <div class="hidden lg:flex w-1/2 bg-primary p-12 flex-col justify-center text-white">
            <div class="max-w-md">
                <img src="images/ICON2.png" alt="Amano.ng Logo" class="w-48 mb-8 object-contain cursor-pointer" onclick="location.href='index.html'">
                
                <p class="text-2xl italic font-light leading-relaxed">
                    "Bridging the trust gap in Nigeria's agricultural trade. From the farm in Kaduna to the market in Uyo, we secure your trade."
                </p>
                <div class="mt-8 flex items-center space-x-4">
                    <div class="h-1 w-20 bg-secondary"></div>
                    <span class="font-semibold uppercase tracking-widest text-sm">Secure B2B Escrow</span>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
            <div class="w-full max-w-md">
                
                <div id="auth-alert" class="hidden mb-6 p-4 rounded-lg text-sm font-medium fade-in"></div>

                <div class="flex mb-8 border-b">
                    <button id="tab-login" class="w-1/2 pb-2 font-semibold text-primary border-b-2 border-primary transition-all" onclick="toggleAuth('login')">Login</button>
                    <button id="tab-signup" class="w-1/2 pb-2 font-semibold text-gray-400 border-b-2 border-transparent transition-all" onclick="toggleAuth('signup')">Sign Up</button>
                </div>

                <form id="login-form" class="space-y-5">
                    <h2 class="text-2xl font-bold text-primary">Welcome Back</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" name="email" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="login-pass" name="password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        <i class="fa fa-eye absolute right-4 top-11 text-gray-400 cursor-pointer" onclick="togglePass('login-pass')"></i>
                    </div>
                    <button type="submit" class="w-full bg-secondary text-white py-3 rounded-lg font-bold hover:opacity-90 transition shadow-md">Sign In</button>
                </form>

                <form id="signup-form" class="hidden space-y-4">
                    <h2 class="text-2xl font-bold text-primary">Create Account</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" name="fullName" required class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">I am a...</label>
                            <select id="role-select" name="role" onchange="toggleSellerFields()" class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                                <option value="buyer">Buyer</option>
                                <option value="seller">Seller</option>
                            </select>
                        </div>
                    </div>

                    <div id="seller-fields" class="hidden space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Business Name</label>
                            <input type="text" name="businessName" class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                            <input type="tel" name="phone" class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" name="email" required class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                    </div>

                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="signup-pass" name="password" oninput="checkStrength(this.value)" required class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                        <i class="fa fa-eye absolute right-4 top-10 text-gray-400 cursor-pointer" onclick="togglePass('signup-pass')"></i>
                        <div class="mt-2 h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                            <div id="strength-bar" class="h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p id="strength-text" class="text-[10px] mt-1 uppercase font-bold text-gray-400">Enter Password</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">State of Operation</label>
                        <select name="state" required class="mt-1 block w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="">Select State</option>
                            <option value="Abia">Abia</option><option value="Adamawa">Adamawa</option><option value="Akwa Ibom">Akwa Ibom</option>
                            <option value="Anambra">Anambra</option><option value="Bauchi">Bauchi</option><option value="Bayelsa">Bayelsa</option>
                            <option value="Benue">Benue</option><option value="Borno">Borno</option><option value="Cross River">Cross River</option>
                            <option value="Delta">Delta</option><option value="Ebonyi">Ebonyi</option><option value="Edo">Edo</option>
                            <option value="Ekiti">Ekiti</option><option value="Enugu">Enugu</option><option value="FCT">FCT - Abuja</option>
                            <option value="Gombe">Gombe</option><option value="Imo">Imo</option><option value="Jigawa">Jigawa</option>
                            <option value="Kaduna">Kaduna</option><option value="Kano">Kano</option><option value="Katsina">Katsina</option>
                            <option value="Kebbi">Kebbi</option><option value="Kogi">Kogi</option><option value="Kwara">Kwara</option>
                            <option value="Lagos">Lagos</option><option value="Nasarawa">Nasarawa</option><option value="Niger">Niger</option>
                            <option value="Ogun">Ogun</option><option value="Ondo">Ondo</option><option value="Osun">Osun</option>
                            <option value="Oyo">Oyo</option><option value="Plateau">Plateau</option><option value="Rivers">Rivers</option>
                            <option value="Sokoto">Sokoto</option><option value="Taraba">Taraba</option><option value="Yobe">Yobe</option>
                            <option value="Zamfara">Zamfara</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-secondary text-white py-3 rounded-lg font-bold hover:opacity-90 transition shadow-md">Join Amano</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth-logic.js"></script>
    <script>
        // Check for URL parameters to auto-switch to signup if ?role=seller is present
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('role') === 'seller') {
                toggleAuth('signup');
                document.getElementById('role-select').value = 'seller';
                toggleSellerFields();
            }
        });

        function toggleAuth(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const alertBox = document.getElementById('auth-alert');

            alertBox.classList.add('hidden');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "w-1/2 pb-2 font-semibold text-primary border-b-2 border-primary transition-all";
                tabSignup.className = "w-1/2 pb-2 font-semibold text-gray-400 border-b-2 border-transparent transition-all";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.className = "w-1/2 pb-2 font-semibold text-primary border-b-2 border-primary transition-all";
                tabLogin.className = "w-1/2 pb-2 font-semibold text-gray-400 border-b-2 border-transparent transition-all";
            }
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        function toggleSellerFields() {
            const role = document.getElementById('role-select').value;
            const sellerFields = document.getElementById('seller-fields');
            if(role === 'seller') {
                sellerFields.classList.remove('hidden');
            } else {
                sellerFields.classList.add('hidden');
            }
        }

        function checkStrength(password) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            if (password.length === 0) {
                bar.style.width = "0%";
                text.innerText = "Enter Password";
                return;
            }
            
            let strength = 0;
            if (password.length > 5) strength++;
            if (/[A-Z]/.test(password) && /[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            if (strength === 1) {
                bar.className = "h-full transition-all duration-300 strength-weak";
                text.innerText = "Weak";
                text.className = "text-[10px] mt-1 uppercase font-bold text-red-500";
            } else if (strength === 2) {
                bar.className = "h-full transition-all duration-300 strength-medium";
                text.innerText = "Medium";
                text.className = "text-[10px] mt-1 uppercase font-bold text-amber-500";
            } else if (strength === 3) {
                bar.className = "h-full transition-all duration-300 strength-strong";
                text.innerText = "Strong";
                text.className = "text-[10px] mt-1 uppercase font-bold text-green-500";
            }
        }
    </script>
</body>
</html>
